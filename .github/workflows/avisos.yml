name: Avisos del FC Barcelona

on:
  schedule:
    # Reserva fija cada 6 h (CRON-INICIO ... CRON-FIN, se edita a mano:
    # avisar.py ya no toca este fichero). Cada job duerme hasta la etapa
    # siguiente y avisa en el minuto exacto: los cron no sirven para una
    # hora concreta, GitHub los entrega con retraso (5 h medidas en 2026-10).
    # CRON-INICIO
    - cron: "20 0 * * *"
    - cron: "20 6 * * *"
    - cron: "20 12 * * *"
    - cron: "20 18 * * *"
    # CRON-FIN
  workflow_dispatch:
    inputs:
      motivo:
        description: "Quien la lanza: manual, prueba o la etapa que encadena el vigia"
        type: string
        default: "manual"
      prueba:
        description: "Enviar un aviso de prueba sin marcar el estado"
        type: boolean
        default: false

permissions:
  contents: write
  # el vigia encadena la siguiente vigilancia con la API de workflow_dispatch
  actions: write

# el vigia duerme hasta la etapa siguiente, asi que las de produccion van
# por un grupo y las de prueba por otro (si no, una prueba quedaria en cola)
concurrency:
  group: avisos-${{ inputs.prueba == true && 'prueba' || 'produccion' }}
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    # un vigia puede dormir hasta 5,5 h seguidas (Actions corta el job a las 6)
    timeout-minutes: 350
    steps:
      - name: Repositorio
        uses: actions/checkout@v6

      - name: Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Dependencias (tarjetas con escudos)
        run: pip install pillow

      - name: Comprobar partidos y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GITHUB_TOKEN: ${{ github.token }}
          PRUEBA: ${{ inputs.prueba }}
          MOTIVO: ${{ inputs.motivo }}
        run: python avisar.py

      - name: Guardar estado
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado.json
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Estado de avisos $(date -u +'%Y-%m-%d %H:%M UTC')"
            git pull --rebase
            git push
          fi
