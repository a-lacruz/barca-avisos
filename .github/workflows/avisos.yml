name: Avisos del FC Barcelona

on:
  schedule:
    # CRON-INICIO (generado automaticamente por avisar.py - no editar a mano)
    - cron: "7 8 * * *"
    - cron: "0 15 17 10 *"
    - cron: "30 15 17 10 *"
    - cron: "15 16 17 10 *"
    - cron: "30 16 17 10 *"
    - cron: "35 18 17 10 *"
    - cron: "5 19 17 10 *"
    - cron: "0 20 17 10 *"
    - cron: "30 21 17 10 *"
    - cron: "30 22 17 10 *"
    - cron: "30 17 20 10 *"
    - cron: "0 18 20 10 *"
    - cron: "45 18 20 10 *"
    - cron: "0 19 20 10 *"
    - cron: "5 21 20 10 *"
    - cron: "35 21 20 10 *"
    - cron: "30 22 20 10 *"
    - cron: "0 0 21 10 *"
    - cron: "0 1 21 10 *"
    # CRON-FIN
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar un aviso de prueba sin marcar el estado"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: avisos-barca
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repositorio
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias (tarjetas con escudos)
        run: pip install pillow

      - name: Comprobar partidos y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PRUEBA: ${{ inputs.prueba }}
        run: python avisar.py

      - name: Guardar estado y cron
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado.json .github/workflows/avisos.yml
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
            exit 0
          fi
          git commit -m "Estado de avisos $(date -u +'%Y-%m-%d %H:%M UTC')"
          if git push; then
            echo "Estado y cron guardados."
            exit 0
          fi
          # El GITHUB_TOKEN no puede modificar .github/workflows/* (GitHub lo
          # exige con el scope 'workflows', que el token de Actions no tiene).
          # Se guarda solo el estado para que la ejecucion no quede en rojo:
          # la escalera de cron se queda como esta hasta el siguiente empuje.
          echo "::warning::Push rechazado por tocar el workflow. Se guarda solo estado.json"
          git reset --soft HEAD~1
          git reset -q
          git add estado.json
          if git diff --cached --quiet; then
            echo "Nada mas que guardar."
            exit 0
          fi
          git commit -m "Estado de avisos $(date -u +'%Y-%m-%d %H:%M UTC') (solo estado)"
          git push
