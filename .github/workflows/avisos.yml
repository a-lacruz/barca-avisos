name: Avisos del FC Barcelona

on:
  schedule:
    # CRON-INICIO (generado automaticamente por avisar.py - no editar a mano)
    - cron: "7 8 * * *"
    - cron: "30 15 17 10 *"
    - cron: "45 15 17 10 *"
    - cron: "0 16 17 10 *"
    - cron: "15 16 17 10 *"
    - cron: "25 16 17 10 *"
    - cron: "45 16 17 10 *"
    - cron: "0 18 20 10 *"
    - cron: "15 18 20 10 *"
    - cron: "30 18 20 10 *"
    - cron: "45 18 20 10 *"
    - cron: "55 18 20 10 *"
    - cron: "15 19 20 10 *"
    # CRON-FIN
  workflow_dispatch:
    inputs:
      prueba:
        description: "Enviar un aviso de prueba sin marcar el estado"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: avisos-barca
  cancel-in-progress: false

jobs:
  avisar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Repositorio
        uses: actions/checkout@v4

      - name: Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Dependencias (tarjetas con escudos)
        run: pip install pillow

      - name: Comprobar partidos y avisar
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          MINUTOS_AVISO: "60"
          PRUEBA: ${{ inputs.prueba }}
        run: python avisar.py

      - name: Guardar estado y cron
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add estado.json .github/workflows/avisos.yml
          if git diff --cached --quiet; then
            echo "Sin cambios que guardar."
          else
            git commit -m "Estado de avisos $(date -u +'%Y-%m-%d %H:%M UTC')"
            git push
          fi
